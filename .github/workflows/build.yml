name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Compile
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Show errors
        if: failure()
        run: |
          # Résume les erreurs dans une annotation lisible depuis la page du run
          grep -E "error:|What went wrong|Could not|Caused by|FAILED|not found|Unsupported" -A3 build.log | head -c 9000 > errors.txt || true
          msg=$(cat errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Erreurs de compilation::${msg}"

      - name: Upload the mod
        uses: actions/upload-artifact@v4
        with:
          name: advancement
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Advancement 1.0.${{ github.run_number }} (Minecraft 1.21.11)
          target_commitish: ${{ github.sha }}
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
