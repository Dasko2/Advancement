name: Explore
on:
  push:
    branches: [explore]
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0
      - name: Build (ignore failure)
        run: gradle compileJava --no-daemon > build.log 2>&1 || true
      - name: Inspect
        run: |
          set +e
          j=/home/runner/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          note() { msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'); echo "::notice title=$1::${msg}"; }
          javap -p -cp $j net.minecraft.client.gui.screens.advancements.AdvancementTab | grep -v -E "lambda|static final" | note A_tab
          javap -p -cp $j net.minecraft.advancements.DisplayInfo | grep -v -E "lambda|static final|Codec" | note B_display
          javap -p -cp $j net.minecraft.client.resources.language.I18n net.minecraft.locale.Language | grep -v lambda | note C_i18n
          javap -p -cp $j net.minecraft.client.gui.Font | grep -E "plainSubstrByWidth|lineHeight|width\(" | note D_font
          javap -p -cp $j net.minecraft.client.gui.GuiGraphicsExtractor | grep -E "outline|text\(|fill\(int|guiWidth|guiHeight|nextStratum" | note E_gfx
          javap -p -cp $j net.minecraft.client.input.KeyEvent | grep -E "key|record" | note F_key
          unzip -l $j | grep -E "com/mojang/blaze3d/platform/InputConstants.class|org/lwjgl/glfw" | head -3 | note G_input
          javap -p -cp $j net.minecraft.client.gui.screens.advancements.AdvancementsScreen | grep -E "extract|render|mouse|key" | note H_screen
          javap -p -cp $j net.minecraft.client.gui.screens.advancements.AdvancementTab | grep -E "hovered|widgets" | note I_fields
          javap -p -c -cp $j net.minecraft.client.gui.screens.advancements.AdvancementTab | grep -A70 "void extractTooltips" | grep -E "extractHover|hovered|void extractTooltips" | note J_code
          grep -E "error:|symbol:" build.log | head -30 | note K_errors
